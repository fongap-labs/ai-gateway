[package]
name = "ai-gateway-installer"
version = "0.1.0"
description = "Beginner-friendly deployment wizard for ai-gateway"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "ai_gateway_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = { version = "0.12" }

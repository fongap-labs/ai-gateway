name: CI

# Pull-request CI is executed centrally by fongap-labs/action-worker.
# Main and scheduled validation remain local until deployment is centralized.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-evidence:
    name: ci-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (merge)
        run: npm run validate:merge

      - name: Dry-run Worker bundle
        run: npm run check:deploy

  validate-deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (deploy)
        run: npm run validate:deploy

  validate-merge:
    name: validate-merge
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - ci-evidence
    steps:
      - name: Validate merge policy
        uses: fongap-labs/action-worker/.github/actions/validate-merge-policy@main
        with:
          ci-result: ${{ needs.ci-evidence.result }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          require-pr-governance: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

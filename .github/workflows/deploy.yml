name: Deploy

# Automatic deploys follow successful CI on main. Secret shard variables remain
# explicit because GitHub Actions cannot enumerate Secret values dynamically.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # IS_DEPLOY_ENABLED=false is an emergency kill switch; forks require explicit true.
  gate:
    if: vars.IS_DEPLOY_ENABLED == 'true' && github.repository == vars.DEPLOY_REPOSITORY
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Decide deploy eligibility
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/deploy-gate-decision.mjs

  deploy-policy:
    name: deploy-policy
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    permissions:
      contents: read
      actions: read
    uses: fongap-labs/action-worker/.github/workflows/validate-deploy-policy.yml@main
    with:
      target_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      ci_workflow: ci.yml
      should_match_default: true

  manual-validate:
    needs:
      - gate
      - deploy-policy
    if: needs.gate.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy-policy.outputs.target_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (deploy suite — single entry point)
        run: npm run validate:deploy

      - name: Dry-run Worker bundle
        run: npm run check:deploy

  deploy:
    needs:
      - gate
      - deploy-policy
      - manual-validate
    # `always()` lets automatic deploys continue when manual-validate is skipped.
    if: always() && needs.gate.outputs.deploy == 'true' && needs.deploy-policy.result == 'success' && (needs.manual-validate.result == 'success' || needs.manual-validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOYED_SHA: ${{ needs.deploy-policy.outputs.target_sha }}
      GITHUB_SHA: ${{ needs.deploy-policy.outputs.target_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      USAGE_D1_ID: ${{ vars.USAGE_D1_ID }}
      AFFINITY_KV_ID: ${{ vars.AFFINITY_KV_ID }}
      GATEWAY_PUBLIC_URL: ${{ vars.GATEWAY_PUBLIC_URL }}
      MODELS_CONFIG: ${{ vars.MODELS_CONFIG }}
      POLICIES_CONFIG: ${{ vars.POLICIES_CONFIG }}
      RATE_COOLDOWN_MS: ${{ vars.RATE_COOLDOWN_MS }}
      EVENT_TIMEOUT_MS: ${{ vars.EVENT_TIMEOUT_MS }}
      STREAM_IDLE_MS: ${{ vars.STREAM_IDLE_MS }}
      AUTH_COOLDOWN_MS: ${{ vars.AUTH_COOLDOWN_MS }}
      MAX_BODY_BYTES: ${{ vars.MAX_BODY_BYTES }}
      FAILOVER_BUDGET_MS: ${{ vars.FAILOVER_BUDGET_MS }}
      HEADER_TIMEOUT_MS: ${{ vars.HEADER_TIMEOUT_MS }}
      HEDGE_DELAY_MS: ${{ vars.HEDGE_DELAY_MS }}
      REQUEST_HEDGE_MAX: ${{ vars.REQUEST_HEDGE_MAX }}
      GATEWAY_KEY_RPM: ${{ vars.GATEWAY_KEY_RPM }}
      ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
      STREAM_INCLUDE_USAGE: ${{ vars.STREAM_INCLUDE_USAGE }}
      INCLUDE_OFF_PROVIDERS: ${{ vars.INCLUDE_OFF_PROVIDERS }}
      SHOULD_EXPOSE_UPSTREAM: ${{ vars.SHOULD_EXPOSE_UPSTREAM }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      HAS_STREAM_GUARD: ${{ vars.HAS_STREAM_GUARD }}
      CAN_USE_HTTP: ${{ vars.CAN_USE_HTTP }}
      ANTHROPIC_COUNT_MODE: ${{ vars.ANTHROPIC_COUNT_MODE }}
      PROTOCOL_FALLBACKS: ${{ vars.PROTOCOL_FALLBACKS }}
      DASHBOARD_MODELS: ${{ vars.DASHBOARD_MODELS }}
      TIER1_NODES_01: ${{ vars.TIER1_NODES_01 }}
      TIER1_NODES_02: ${{ vars.TIER1_NODES_02 }}
      TIER1_NODES_03: ${{ vars.TIER1_NODES_03 }}
      TIER1_NODES_04: ${{ vars.TIER1_NODES_04 }}
      TIER1_NODES_05: ${{ vars.TIER1_NODES_05 }}
      TIER1_NODES_06: ${{ vars.TIER1_NODES_06 }}
      TIER1_NODES_07: ${{ vars.TIER1_NODES_07 }}
      TIER1_NODES_08: ${{ vars.TIER1_NODES_08 }}
      TIER1_NODES_09: ${{ vars.TIER1_NODES_09 }}
      TIER1_NODES_10: ${{ vars.TIER1_NODES_10 }}
      TIER2_NODES_01: ${{ vars.TIER2_NODES_01 }}
      TIER2_NODES_02: ${{ vars.TIER2_NODES_02 }}
      TIER2_NODES_03: ${{ vars.TIER2_NODES_03 }}
      TIER2_NODES_04: ${{ vars.TIER2_NODES_04 }}
      TIER2_NODES_05: ${{ vars.TIER2_NODES_05 }}
      TIER2_NODES_06: ${{ vars.TIER2_NODES_06 }}
      TIER2_NODES_07: ${{ vars.TIER2_NODES_07 }}
      TIER2_NODES_08: ${{ vars.TIER2_NODES_08 }}
      TIER2_NODES_09: ${{ vars.TIER2_NODES_09 }}
      TIER2_NODES_10: ${{ vars.TIER2_NODES_10 }}
      TIER3_NODES_01: ${{ vars.TIER3_NODES_01 }}
      TIER3_NODES_02: ${{ vars.TIER3_NODES_02 }}
      TIER3_NODES_03: ${{ vars.TIER3_NODES_03 }}
      TIER3_NODES_04: ${{ vars.TIER3_NODES_04 }}
      TIER3_NODES_05: ${{ vars.TIER3_NODES_05 }}
      TIER3_NODES_06: ${{ vars.TIER3_NODES_06 }}
      TIER3_NODES_07: ${{ vars.TIER3_NODES_07 }}
      TIER3_NODES_08: ${{ vars.TIER3_NODES_08 }}
      TIER3_NODES_09: ${{ vars.TIER3_NODES_09 }}
      TIER3_NODES_10: ${{ vars.TIER3_NODES_10 }}
      CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      GATEWAY_KEY_AIR: ${{ secrets.GATEWAY_KEY_AIR }}
      GATEWAY_MODELS_AIR: ${{ vars.GATEWAY_MODELS_AIR }}
      GATEWAY_KEY_PRO: ${{ secrets.GATEWAY_KEY_PRO }}
      GATEWAY_MODELS_PRO: ${{ vars.GATEWAY_MODELS_PRO }}
      GATEWAY_KEY_MAX: ${{ secrets.GATEWAY_KEY_MAX }}
      GATEWAY_MODELS_MAX: ${{ vars.GATEWAY_MODELS_MAX }}
      GATEWAY_KEY_ULTRA: ${{ secrets.GATEWAY_KEY_ULTRA }}
      GATEWAY_MODELS_ULTRA: ${{ vars.GATEWAY_MODELS_ULTRA }}
      GATEWAY_KEY_AGENT: ${{ secrets.GATEWAY_KEY_AGENT }}
      GATEWAY_MODELS_AGENT: ${{ vars.GATEWAY_MODELS_AGENT }}
      TIER1_KEYS_01: ${{ secrets.TIER1_KEYS_01 }}
      TIER1_KEYS_02: ${{ secrets.TIER1_KEYS_02 }}
      TIER1_KEYS_03: ${{ secrets.TIER1_KEYS_03 }}
      TIER1_KEYS_04: ${{ secrets.TIER1_KEYS_04 }}
      TIER1_KEYS_05: ${{ secrets.TIER1_KEYS_05 }}
      TIER1_KEYS_06: ${{ secrets.TIER1_KEYS_06 }}
      TIER1_KEYS_07: ${{ secrets.TIER1_KEYS_07 }}
      TIER1_KEYS_08: ${{ secrets.TIER1_KEYS_08 }}
      TIER1_KEYS_09: ${{ secrets.TIER1_KEYS_09 }}
      TIER1_KEYS_10: ${{ secrets.TIER1_KEYS_10 }}
      TIER2_KEYS_01: ${{ secrets.TIER2_KEYS_01 }}
      TIER2_KEYS_02: ${{ secrets.TIER2_KEYS_02 }}
      TIER2_KEYS_03: ${{ secrets.TIER2_KEYS_03 }}
      TIER2_KEYS_04: ${{ secrets.TIER2_KEYS_04 }}
      TIER2_KEYS_05: ${{ secrets.TIER2_KEYS_05 }}
      TIER2_KEYS_06: ${{ secrets.TIER2_KEYS_06 }}
      TIER2_KEYS_07: ${{ secrets.TIER2_KEYS_07 }}
      TIER2_KEYS_08: ${{ secrets.TIER2_KEYS_08 }}
      TIER2_KEYS_09: ${{ secrets.TIER2_KEYS_09 }}
      TIER2_KEYS_10: ${{ secrets.TIER2_KEYS_10 }}
      TIER3_KEYS_01: ${{ secrets.TIER3_KEYS_01 }}
      TIER3_KEYS_02: ${{ secrets.TIER3_KEYS_02 }}
      TIER3_KEYS_03: ${{ secrets.TIER3_KEYS_03 }}
      TIER3_KEYS_04: ${{ secrets.TIER3_KEYS_04 }}
      TIER3_KEYS_05: ${{ secrets.TIER3_KEYS_05 }}
      TIER3_KEYS_06: ${{ secrets.TIER3_KEYS_06 }}
      TIER3_KEYS_07: ${{ secrets.TIER3_KEYS_07 }}
      TIER3_KEYS_08: ${{ secrets.TIER3_KEYS_08 }}
      TIER3_KEYS_09: ${{ secrets.TIER3_KEYS_09 }}
      TIER3_KEYS_10: ${{ secrets.TIER3_KEYS_10 }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy-policy.outputs.target_sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight deployment configuration
        run: node scripts/github-deployment-config.mjs preflight

      - name: Validate runtime configuration
        run: |
          node scripts/github-deployment-config.mjs prepare --from-env \
            --wrangler "$RUNNER_TEMP/wrangler.github.json" \
            --secrets "$RUNNER_TEMP/gateway-secrets.json" \
            --summary "$RUNNER_TEMP/deployment-summary.txt"

      - name: Apply D1 migrations
        if: env.USAGE_D1_ID != ''
        env:
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          USAGE_D1_ID: ${{ vars.USAGE_D1_ID }}
        run: npx --yes wrangler@4.114.0 d1 migrations apply ai-gateway-stats --remote -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Deploy Worker (atomic code+secrets)
        id: deploy
        env:
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 deploy --secrets-file "$RUNNER_TEMP/gateway-secrets.json" -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Verify deployed gateway
        id: health-check
        run: |
          for attempt in 1 2 3; do
            if node scripts/github-deployment-config.mjs health-check --from-env --expected-build "$DEPLOYED_SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::notice::Post-deploy health check attempt ${attempt}/3 failed; retrying in 5s."
              sleep 5
            fi
          done
          echo "::error::Post-deploy health check failed after 3 attempts."
          exit 1

      - name: Rollback to previous Worker version
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::notice::Rolling back Worker code for deployed SHA: ${DEPLOYED_SHA}"
          npx --yes wrangler@4.114.0 rollback -c "$RUNNER_TEMP/wrangler.github.json"

      - name: Verify rolled-back gateway
        if: failure() && steps.rollback.outcome == 'success'
        run: |
          node scripts/github-deployment-config.mjs health-check --from-env || {
            echo "::error::Rollback health check also failed — the previous version may not be healthy either. Manual intervention required."
            exit 1
          }

      - name: Deployment summary
        if: success()
        env:
          DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
        run: |
          {
            cat "$RUNNER_TEMP/deployment-summary.txt"
            echo ""
            echo "Identity"
            echo "  Deployed SHA: ${DEPLOYED_SHA}"
          } | tee "$GITHUB_STEP_SUMMARY"

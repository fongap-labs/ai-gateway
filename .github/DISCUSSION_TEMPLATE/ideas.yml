body:
  - type: markdown
    attributes:
      value: |
        请提出有针对性的 ai-gateway 改进想法。

        想法适用于仍需讨论、确认价值或界定实现边界的提案。一旦某个方向被确定要实施，即可转为 Issue 以跟踪执行。

  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 描述你希望新增、修改或移除的内容。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述该提案背后的具体限制、故障模式或工作流问题。
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 兼容性与资源影响
      description: 可选。请说明对协议、安全、延迟、存储、Cloudflare 资源或维护成本的影响。

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索现有 Discussions 与 Issue，未发现明显的重复项。
          required: true
        - label: 这不是已确认的可复现缺陷；若是，我会改为提交 Issue。
          required: true
